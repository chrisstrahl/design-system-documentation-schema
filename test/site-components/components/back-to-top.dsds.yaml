kind: component
id: back-to-top
name: BackToTop
description: A plain text link back to the top of the page (or any target href), shown at the end of long content.

metadata:
  tags: [navigation]
  status: {status: stable}

sections:
  - kind: guidelines
    for: agent
    framing: when-to-use
    items:
      - level: should
        statement: Use at the end of a page long enough that scrolling back up by hand is real friction (e.g. the Schema page's full definition list). Skip it on short pages where the top is one scroll or keystroke away.
        checkedBy: manual

  - kind: guidelines
    for: all
    items:
      - level: should
        statement: Place at the end of a long page's content, not mid-page — it's styled as a trailing link (top margin, no visual separation from surrounding content), not a floating or sticky control.
        checkedBy: manual

sourceFiles:
  - platform: web-component
    file: ../../../site/components/back-to-top.js

imports:
  - platform: web-component
    code: <ds-back-to-top label="↑ Back to schema index" href="#top"></ds-back-to-top>

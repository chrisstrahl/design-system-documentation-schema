id: button-group
kind: component
name: Button Group
description: A set of related buttons laid out together, sharing consistent spacing and alignment.

metadata:
  tags: [actions, layout]
  since: 1.1.0
  status: {status: stable}

sections:
  - kind: guidelines
    for: all
    items:
      - level: should
        statement: Limit to actions a user is choosing between, not an unrelated toolbar of controls.
      - level: may
        statement: Order buttons by how often each action is taken, most frequent first, unless a platform convention dictates otherwise.

refs:
  - to: button
    rel: composes

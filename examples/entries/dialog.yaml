kind: component
id: dialog
name: Dialog
description: A modal surface that interrupts the current task until the user responds or dismisses it.

metadata:
  tags: [overlay, modal]
  since: 1.0.0
  status: {status: stable}

sections:
  - kind: guidelines
    for: all
    items:
      - level: must
        statement: Move focus to the dialog when it opens, and return it to the triggering element when it closes.
      - level: should
        statement: Dismiss on Escape unless the dialog is blocking on an action the user must explicitly choose.
